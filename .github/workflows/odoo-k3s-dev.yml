name: Odoo K3s DEV

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - docker/k3s-dev/**
      - .github/workflows/odoo-k3s-dev.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push DEV
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/k3s-dev/Dockerfile
          push: true
          tags: ghcr.io/jsolisba/odoo-k3s-dev:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
