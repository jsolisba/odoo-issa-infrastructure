apiVersion: v1
kind: PersistentVolume
metadata:
  name: odoo-dev-postgres-pv
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  local:
    path: /mnt/longhorn-backups/kubernetes-data/dev/odoo/postgres
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - vmi2338707.contaboserver.net
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: odoo-dev-filestore-pv
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  local:
    path: /mnt/longhorn-backups/kubernetes-data/dev/odoo/filestore
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - vmi2338707.contaboserver.net
