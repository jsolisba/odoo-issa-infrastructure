apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: odoo-dev-postgres-pvc
  namespace: dev
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  volumeName: odoo-dev-postgres-pv
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: odoo-dev-filestore-pvc
  namespace: dev
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  volumeName: odoo-dev-filestore-pv
  resources:
    requests:
      storage: 10Gi
